---
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      # Draft pull requests run only the cheap checks, so the full suite has to
      # be triggered when one is marked ready
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - test
      - prek

    steps:
      - name: Failed
        run: exit 1
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')

  test:
    # Skipped on draft pull requests: the completion check then fails, which is
    # correct, as a draft is not mergeable
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - alpine
          - debian
    env:
      DISTRO: ${{ matrix.distro }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@v1
      - run: bundle install
      - run: bundle exec rake

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Build Docker image for single platform
        run: ./script/release-workflow/docker-build.sh

      - name: Assert the runtime image carries no build tooling
        run: ./script/test-image-contract.sh

      # Scanned on the release pull request alone, so a new CVE blocks the
      # release rather than the publish job that runs after the tag is pushed.
      # Skipped steps leave the job green, which the completion check needs.
      - name: Manual Trivy Setup
        if: github.head_ref == 'release/pact-broker-docker'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          cache: true

      - name: Audit Docker image
        if: github.head_ref == 'release/pact-broker-docker'
        run: |
          . ./script/release-workflow/set-env-vars.sh
          ./script/scan-image.sh "${DOCKER_IMAGE_ORG_AND_NAME}:latest-${ARCH}${TAG_SUFFIX}"

      - name: Verify the scan tiers produce SARIF
        if: github.head_ref == 'release/pact-broker-docker'
        run: |
          . ./script/release-workflow/set-env-vars.sh
          ./script/test-scan-tiers.sh "${DOCKER_IMAGE_ORG_AND_NAME}:latest-${ARCH}${TAG_SUFFIX}"

      - uses: KengoTODA/actions-setup-docker-compose@caf887cb5173b7ea66cce3c7db3b1e04974a53d4  # v1.2.8
        if: ${{ env.ACT }}
        name: Install `docker-compose` for use with https://github.com/nektos/act
        with:
          version: 2.15.1

      - name: Integration tests
        run: script/test.sh
        env:
          TAG: latest-amd64

      # The image under test reaches the compose files through
      # PACT_BROKER_IMAGE; a suite that edits them instead fails here.
      - name: Assert the suite left the checkout clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain >&2
            exit 1
          fi

  prek:
    name: prek

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0

  committed:
    name: Check commit messages
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f  # v1.1.11
