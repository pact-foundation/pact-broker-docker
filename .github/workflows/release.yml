name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install git-cliff
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: git-cliff

      - name: Update release PR
        # The App token, not GITHUB_TOKEN: it can push the release branch under
        # branch protection, and pull requests it opens trigger workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ruby script/release.rb prepare

  tag:
    name: Create release tag
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/pact-broker-docker'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Tag release
        # The App token, not GITHUB_TOKEN, so the pushed tag triggers publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ruby script/release.rb tag

  publish:
    name: Publish image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, debian]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match VERSION ($file_version)" >&2
            exit 1
          fi

      - name: Log into ghcr registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set environment variables
        run: |
          if [ "${{ matrix.distro }}" = "debian" ]; then
            echo "IS_DEBIAN=1" >> $GITHUB_ENV
          fi

      - name: Release image
        run: script/release-workflow/run.sh
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract release changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="${{ runner.temp }}/release-changelog.md"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, ver)) found=1; next }
            found && !/^<a name=/ { print }
          ' CHANGELOG.md > "$out"
          if ! grep -q '[^[:space:]]' "$out"; then
            printf '> [!WARNING]\n>\n> No changelog entry found for %s.\n' "$version" > "$out"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body_path: ${{ runner.temp }}/release-changelog.md
          draft: false
          prerelease: false
