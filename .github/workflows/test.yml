---
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      # Draft pull requests run only the cheap checks, so the full suite has to
      # be triggered when one is marked ready
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - test
      - prek

    steps:
      - name: Failed
        run: exit 1
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')

  test:
    # Skipped on draft pull requests: the completion check then fails, which is
    # correct, as a draft is not mergeable
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - alpine
          - debian

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@v1
      - run: bundle install
      - run: bundle exec rake

      - name: Set environment variables
        run: |
          if [ "${{ matrix.distro }}" = "debian" ]; then
            echo "IS_DEBIAN=1" >> $GITHUB_ENV
          fi
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build Docker image for single platform
        run: ./script/release-workflow/docker-build.sh

      - name: Assert the runtime image carries no build tooling
        run: ./script/test-image-contract.sh
        env:
          DISTRO: ${{ matrix.distro }}

      # Scanned on the release pull request alone, so a new CVE blocks the
      # release rather than the publish job that runs after the tag is pushed.
      # Skipped steps leave the job green, which the completion check needs.
      - name: Manual Trivy Setup
        if: github.head_ref == 'release/pact-broker-docker'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          cache: true

      - name: Audit Docker image
        if: github.head_ref == 'release/pact-broker-docker'
        run: |
          . ./script/release-workflow/set-env-vars.sh
          ./script/scan-image.sh "${DOCKER_IMAGE_ORG_AND_NAME}:latest-${ARCH}${IS_DEBIAN:+-debian}"

      - uses: KengoTODA/actions-setup-docker-compose@f39674ee3a0f309c94ecf9c442e2cfde74a3f764  # v1.2.6
        if: ${{ env.ACT }}
        name: Install `docker-compose` for use with https://github.com/nektos/act
        with:
          version: 2.15.1

      - name: Integration tests
        run: script/test-clean-tree.sh
        env:
          TAG: latest-amd64

  prek:
    name: prek

    runs-on: ubuntu-latest

    env:
      PREK_HOME: ${{ github.workspace }}/.prek

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache prek
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ env.PREK_HOME }}
          key: |
            ${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-suffix: prek
          cache-dependency-glob: ''

      - name: Install prek
        run: uv tool install prek

      - name: Run prek
        run: prek run --show-diff-on-failure --color=always --all-files
