#:schema https://raw.githubusercontent.com/j178/prek/refs/heads/master/prek.schema.json
#:tombi toml-version = "v1.1.0"

default_install_hook_types = ["commit-msg", "pre-commit", "pre-push"]
# Unless otherwise specified, all hooks below are run during pre-commit.
default_stages = ["pre-commit"]

# Generic file hygiene
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-vcs-permalinks" },
  { id = "destroyed-symlinks" },
  # ssl/ holds a self-signed certificate for the SSL docker-compose example.
  { id = "detect-private-key", exclude = "^ssl/" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
  # The following only check that the files are parseable and do _not_ modify
  # the formatting.
  { id = "check-json" },
  { id = "check-toml" },
  # The CloudFormation templates use intrinsic-function tags such as !Ref,
  # which the parser behind this hook does not know.
  {
    id = "check-yaml",
    exclude = '^example-k8s-deployment/infrastructure/[^/]+/template\.yaml$'
  },
]

# YAML formatting
[[repos]]
repo = "https://github.com/lyz-code/yamlfix/"
rev = "1.19.1"
hooks = [{ id = "yamlfix", args = ["--config-file", ".yamlfix.toml"] }]

# TOML formatting
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.6"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

# Commit message style, which the release process depends on: git-cliff derives
# both the changelog and the version bump from the conventional commit type.
[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [{ id = "committed" }]

# Spell checking
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [{ id = "typos" }]

# Markdown linting
[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.64"
hooks = [{ id = "rumdl" }]

# Dockerfile linting
[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "v2.15.1"
hooks = [
  # The variant Dockerfiles are not recognised by filename alone.
  { id = "hadolint", files = "(?i)(^|/)Dockerfile([.-].*)?$" },
]

# Shell script linting
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  # The scripts lean on word splitting in enough places that SC2086 and its
  # info-level neighbours are noise here.
  { id = "shellcheck", args = ["--external-sources", "--severity=warning"] },
]

# Shell script formatting
[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [{ id = "shfmt" }]
