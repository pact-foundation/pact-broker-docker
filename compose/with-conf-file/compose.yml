---
services:
  pact-broker:
    # image: pactfoundation/pact-broker:3.0.0-pactbroker2.121.2
    build:
      context: ../..
      target: runtime
    ports:
      - 9292:9292
    environment:
      PACT_BROKER_CONF: /tmp/pact_broker.yml
    volumes:
      - ../../docker/config/pact_broker.yml:/tmp/pact_broker.yml
