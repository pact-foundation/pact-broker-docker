---
name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      # Draft pull requests run only the cheap checks, so the full suite has to
      # be triggered when one is marked ready
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - test
      - prek

    steps:
      - name: Failed
        run: exit 1
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')

  test:
    # Skipped on draft pull requests: the completion check then fails, which is
    # correct, as a draft is not mergeable
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - alpine
          - debian

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@v1
      - run: bundle install
      - run: bundle exec rake

      - name: Set environment variables
        run: |
          if [ "${{ matrix.distro }}" = "debian" ]; then
            echo "IS_DEBIAN=1" >> $GITHUB_ENV
          fi
      - name: Setup Docker builder
        run: ./script/release-workflow/docker-prepare.sh

      - name: Build Docker image for single platform
        run: ./script/release-workflow/docker-build.sh

      - uses: KengoTODA/actions-setup-docker-compose@477353946803dd64eaa44008b865b6bfc88cab4e  # v1.2.4
        if: ${{ env.ACT }}
        name: Install `docker-compose` for use with https://github.com/nektos/act
        with:
          version: 2.15.1

      - name: Integration tests
        run: script/test.sh
        env:
          TAG: latest-amd64

  prek:
    name: prek

    runs-on: ubuntu-latest

    env:
      PREK_HOME: ${{ github.workspace }}/.prek

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache prek
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ env.PREK_HOME }}
          key: |
            ${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-suffix: prek
          cache-dependency-glob: ''

      - name: Install prek
        run: uv tool install prek

      - name: Run prek
        run: prek run --show-diff-on-failure --color=always --all-files
