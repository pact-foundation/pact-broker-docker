---
name: Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 4  # Midnight Wednesday

jobs:
  audit:
    name: 👮 audit (${{ matrix.distro }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: alpine, platform: linux/amd64, runner: ubuntu-latest}
          - {distro: alpine, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {distro: debian, platform: linux/amd64, runner: ubuntu-latest}
          - {distro: debian, platform: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          cache: true

      # test.yml only runs this contract check on linux/amd64 (PLATFORM
      # defaults there), so this is the only per-platform contract
      # verification for arm64 in the repository — it is not
      # redundant with the build below despite sharing target and args.
      - name: Verify the image contract
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg DISTRO="${{ matrix.distro }}" \
            --target contract \
            --output type=cacheonly \
            -f Dockerfile .

      - name: Build image for scanning
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg DISTRO="${{ matrix.distro }}" \
            --target runtime \
            --output type=docker \
            --tag audit-target:local \
            -f Dockerfile .

      - name: Scan
        run: ./script/scan-image.sh audit-target:local

      - name: Upload results to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.distro }}-${{ matrix.platform }}
