---
name: Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install git-cliff
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: git-cliff

      - name: Update release PR
        # The App token, not GITHUB_TOKEN: it can push the release branch under
        # branch protection, and pull requests it opens trigger workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ruby script/release.rb prepare

  tag:
    name: Create release tag
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/pact-broker-docker'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Tag release
        # The App token, not GITHUB_TOKEN, so the pushed tag triggers publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ruby script/release.rb tag

  build:
    name: Build (${{ matrix.distro }}, ${{ matrix.platform }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: alpine, platform: linux/amd64, runner: ubuntu-latest}
          - {distro: alpine, platform: linux/arm64, runner: ubuntu-24.04-arm}
          # No arm/v7 runner exists, so this leg is emulated wherever it runs.
          - {distro: alpine, platform: linux/arm/v7, runner: ubuntu-latest}
          - {distro: debian, platform: linux/amd64, runner: ubuntu-latest}
          - {distro: debian, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {distro: debian, platform: linux/arm/v7, runner: ubuntu-latest}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match VERSION ($file_version)" >&2
            exit 1
          fi

      - name: Derive the release tags and image names
        env:
          IS_DEBIAN: ${{ matrix.distro == 'debian' && '1' || '' }}
        run: |
          . ./script/release-workflow/set-env-vars.sh
          {
            echo "TAG=${TAG}"
            echo "DOCKER_HUB_IMAGE=${DOCKER_IMAGE_ORG_AND_NAME}"
            echo "GHCR_IMAGE=ghcr.io/$(echo "${DOCKER_IMAGE_ORG_AND_NAME}" | sed 's/pactfoundation/pact-foundation/')"
          } >> "$GITHUB_ENV"

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log into ghcr registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(matrix.platform, 'arm/v7')
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          cache: true

      # One build per platform, pushed to both registries by digest under a
      # single exporter, so the two registries hold the same digest and each
      # manifest list is assembled from blobs already in its own registry.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            DISTRO=${{ matrix.distro }}
            VERSION=${{ env.TAG }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # This step must never gain a `tags:` input. buildx overwrites the
          # exporter's `name` attribute with the joined tags, which would drop
          # the GHCR name and publish to Docker Hub alone, with no error.
          outputs: type=image,"name=${{ env.DOCKER_HUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # Both distro and platform, or the six legs evict each other and
          # every build is cold.
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.platform }}

      # The bytes scanned are the bytes pushed. A failure here fails this leg,
      # which fails `merge`, so no manifest list points at an unscanned image.
      - name: Scan the pushed digest
        run: >-
          ./script/scan-image.sh
          "${DOCKER_HUB_IMAGE}@${{ steps.build.outputs.digest }}"
          "${{ matrix.platform }}"

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # job-index is unique per leg and, unlike the platform, contains no `/`.
      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.distro }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Assemble manifest (${{ matrix.distro }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro:
          - alpine
          - debian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digests-${{ matrix.distro }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log into ghcr registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Assemble the manifest lists
        env:
          IS_DEBIAN: ${{ matrix.distro == 'debian' && '1' || '' }}
        run: |
          . ./script/release-workflow/set-env-vars.sh
          ghcr_image="ghcr.io/$(echo "${DOCKER_IMAGE_ORG_AND_NAME}" | sed 's/pactfoundation/pact-foundation/')"

          # MAJOR_TAG is derived from VERSION only on the release path. A
          # one-off push supplies TAG and leaves it unset, where an unguarded
          # expansion would ask for the tag `-debian`, or for no tag at all.
          tags="${TAG}${DEBIAN}"
          if [ -n "${MAJOR_TAG:-}" ]; then
            tags="${tags} ${MAJOR_TAG}${DEBIAN}"
          fi
          if [ "${PUSH_TO_LATEST}" != "false" ]; then
            tags="${tags} latest${DEBIAN}"
          fi

          for image in "${DOCKER_IMAGE_ORG_AND_NAME}" "${ghcr_image}"; do
            args=""
            for tag in ${tags}; do
              args="${args} --tag ${image}:${tag}"
            done
            for digest in /tmp/digests/*; do
              args="${args} ${image}@sha256:$(basename "${digest}")"
            done
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
              ${args}
          done

      - name: Inspect the manifest lists
        env:
          IS_DEBIAN: ${{ matrix.distro == 'debian' && '1' || '' }}
        run: |
          . ./script/release-workflow/set-env-vars.sh
          ghcr_image="ghcr.io/$(echo "${DOCKER_IMAGE_ORG_AND_NAME}" | sed 's/pactfoundation/pact-foundation/')"
          docker buildx imagetools inspect "${DOCKER_IMAGE_ORG_AND_NAME}:${TAG}${DEBIAN}"
          docker buildx imagetools inspect "${ghcr_image}:${TAG}${DEBIAN}"

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - merge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract release changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="${{ runner.temp }}/release-changelog.md"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, ver)) found=1; next }
            found && !/^<a name=/ { print }
          ' CHANGELOG.md > "$out"
          if ! grep -q '[^[:space:]]' "$out"; then
            printf '> [!WARNING]\n>\n> No changelog entry found for %s.\n' "$version" > "$out"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-changelog.md
          draft: false
          prerelease: false

  notify-docs:
    name: Trigger docs.pact.io update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - github-release
    steps:
      - name: Trigger docs.pact.io update workflow
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.GHTOKENFORTRIGGERINGPACTDOCSUPDATE }}
          repository: pact-foundation/docs.pact.io
          event-type: pact-broker-docker-pactfoundation-docs-updated
