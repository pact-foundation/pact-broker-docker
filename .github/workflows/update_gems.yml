name: Update gems

on:
  repository_dispatch:
    types:
      - gem-released
  workflow_dispatch:
    inputs:
      released_gem_name:
        description: The name of the gem that was released
        default: pact_broker
        required: false
      released_gem_version:
        description: The version of the gem that was released
        required: true

permissions:
  contents: read

env:
  RELEASED_GEM_NAME: '${{ github.event.client_payload.name }}${{ github.event.inputs.released_gem_name }}'
  RELEASED_GEM_VERSION: '${{ github.event.client_payload.version }}${{ github.event.inputs.released_gem_version }}'
  BRANCH: deps/pact_broker

jobs:
  update:
    name: Open gem update PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          working-directory: pact_broker

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Update gems
        run: script/update-gems-workflow/update-gems.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet pact_broker/Gemfile.lock; then
            echo "No gems updated."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          title="feat(deps): update ${RELEASED_GEM_NAME} gem to ${RELEASED_GEM_VERSION}"
          body="Released by [pact_broker](https://github.com/pact-foundation/pact_broker/releases/tag/v${RELEASED_GEM_VERSION}). Merging this updates the release PR for the Docker images."
          git checkout -B "$BRANCH"
          git add pact_broker/Gemfile.lock
          git commit -m "$title"
          git push --force origin "$BRANCH"

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$number" ] || [ "$number" = "null" ]; then
            gh pr create --base master --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$number" --title "$title" --body "$body"
          fi

          # Auto-merge hands the decision to branch protection: it merges on
          # green if that is all the rules require, and waits for an approval
          # if they require one. It errors when the PR has no pending checks
          # and is already mergeable, so fall back to a direct merge then.
          gh pr merge --auto --squash "$BRANCH" || gh pr merge --squash "$BRANCH"
